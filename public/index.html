<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Yango Lite – Customer App</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#007AFF" />
  <style>
    :root {
      --primary: #007AFF;
      --bg: #f5f5f5;
      --card-bg: #ffffff;
      --text: #333333;
      --text-light: #888888;
      --border: #e0e0e0;
      --gap: 16px;
    }
    
    * { box-sizing: border-box; }
    
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      font-size: 16px;
    }
    
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--gap);
      padding: 16px 20px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 30;
    }
    
    header h1 {
      margin: 0;
      font-size: 24px;
      color: var(--primary);
      font-weight: 700;
    }
    
    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    
    main {
      padding: var(--gap);
      max-width: 600px;
      margin: 0 auto;
      padding-bottom: 120px;
    }
    
    .panel {
      padding: var(--gap);
      background: var(--card-bg);
      border-radius: 12px;
      margin-bottom: var(--gap);
      border: 1px solid var(--border);
    }
    
    .panel h2 {
      margin: 0 0 var(--gap) 0;
      font-size: 18px;
      color: var(--primary);
    }
    
    .form-group {
      margin-bottom: var(--gap);
    }
    
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      font-size: 14px;
      color: var(--text);
    }
    
    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="tel"],
    input[type="number"],
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 16px;
      color: var(--text);
      background: var(--card-bg);
      transition: border-color 0.3s ease;
    }
    
    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.1);
    }
    
    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      padding: 12px 16px;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    button:active {
      transform: scale(0.98);
    }
    
    .btn-primary {
      background: var(--primary);
      color: white;
      width: 100%;
      font-weight: 700;
    }
    
    .btn-primary:hover:not(:disabled) {
      background: #0052cc;
    }
    
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .btn-secondary {
      background: var(--bg);
      color: var(--primary);
      border: 2px solid var(--primary);
    }
    
    .btn-secondary:hover {
      background: rgba(0, 122, 255, 0.1);
    }
    
    .hidden {
      display: none !important;
    }
    
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    
    .modal.show {
      display: flex;
    }
    
    .modal-content {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 16px;
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow-y: auto;
    }
    
    .modal h3 {
      margin-top: 0;
      margin-bottom: 20px;
      color: var(--primary);
      font-size: 20px;
    }
    
    .message {
      margin: 12px 0;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
    }
    
    .message.error {
      background: #fee;
      color: #c00;
      border-left: 4px solid #c00;
      display: block;
    }
    
    .message.success {
      background: #efe;
      color: #060;
      border-left: 4px solid #060;
      display: block;
    }
    
    .row {
      display: flex;
      gap: 12px;
      margin-bottom: var(--gap);
    }
    
    .row > * {
      flex: 1;
    }
    
    @media (max-width: 480px) {
      header h1 { font-size: 18px; }
      main { padding: 12px; }
      .panel { padding: 12px; }
    }
  </style>
</head>
<body>
  <header role="banner">
    <h1>🚗 Yango Lite</h1>
    <div class="header-right">
      <button id="loginBtn" onclick="showLogin()" class="btn-secondary">Login</button>
      <button id="registerBtn" onclick="showRegister()" class="btn-secondary">Register</button>
      <button id="logoutBtn" onclick="logout()" class="btn-secondary hidden">Logout</button>
    </div>
  </header>

  <main>
    <section class="panel">
      <p>
        <strong>User:</strong> <span id="username">Guest</span> <br/>
        <strong>Balance:</strong> K<span id="balance">0.00</span>
      </p>
    </section>

    <section class="panel" id="mainContent">
      <h2>Book a Ride</h2>
      <p style="color: var(--text-light); margin-top: 0;">Login to book a ride.</p>
    </section>
  </main>

  <!-- Login Modal -->
  <div class="modal" id="loginModal">
    <div class="modal-content">
      <h3>Login</h3>
      <div class="form-group">
        <label>Phone Number</label>
        <input id="loginPhone" type="tel" placeholder="+260761234567" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input id="loginPassword" type="password" placeholder="Password" />
      </div>
      <div id="loginMessage" class="message"></div>
      <button class="btn-primary" onclick="login()">Login</button>
      <button class="btn-secondary" style="margin-top: 10px; width: 100%;" onclick="hideModals()">Cancel</button>
    </div>
  </div>

  <!-- Register Modal -->
  <div class="modal" id="registerModal">
    <div class="modal-content">
      <h3>Create Account</h3>
      <div class="form-group">
        <label>Full Name</label>
        <input id="regName" type="text" placeholder="John Doe" />
      </div>
      <div class="form-group">
        <label>Phone Number</label>
        <input id="regPhone" type="tel" placeholder="+260761234567" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input id="regPassword" type="password" placeholder="Password" />
      </div>
      <div id="registerMessage" class="message"></div>
      <button class="btn-primary" onclick="register()">Register</button>
      <button class="btn-secondary" style="margin-top: 10px; width: 100%;" onclick="hideModals()">Cancel</button>
    </div>
  </div>

  <script>
    const API_BASE = window.location.origin + '/api';
    const TOKEN_KEY = 'yango_token';
    let currentUser = null;

    function updateUI() {
      const name = currentUser ? currentUser.username : 'Guest';
      const balance = currentUser ? Number(currentUser.balance || 0).toFixed(2) : '0.00';
      
      document.getElementById('username').textContent = name;
      document.getElementById('balance').textContent = balance;
      
      document.getElementById('loginBtn').classList.toggle('hidden', !!currentUser);
      document.getElementById('registerBtn').classList.toggle('hidden', !!currentUser);
      document.getElementById('logoutBtn').classList.toggle('hidden', !currentUser);
      
      if (currentUser) {
        document.getElementById('mainContent').innerHTML = '<h2>Welcome!</h2><p>Balance: K' + balance + '</p>';
      }
    }

    async function apiFetch(path, opts = {}) {
      const url = API_BASE + path;
      const headers = opts.headers || {};
      
      const token = localStorage.getItem(TOKEN_KEY);
      if (token) headers['Authorization'] = 'Bearer ' + token;
      
      let body = null;
      if (opts.body) {
        body = JSON.stringify(opts.body);
        headers['Content-Type'] = 'application/json';
      }
      
      try {
        const res = await fetch(url, {
          method: opts.method || 'GET',
          headers,
          body
        });
        
        const text = await res.text();
        let json = null;
        try { json = text ? JSON.parse(text) : null; } catch (e) { json = null; }
        
        if (!res.ok) {
          throw new Error(json?.error || `HTTP ${res.status}`);
        }
        
        return json;
      } catch (err) {
        console.error('[API]', path, err.message);
        throw err;
      }
    }

    function showLogin() {
      document.getElementById('loginPhone').value = '';
      document.getElementById('loginPassword').value = '';
      document.getElementById('loginMessage').textContent = '';
      document.getElementById('loginMessage').className = 'message';
      document.getElementById('loginModal').classList.add('show');
    }

    function showRegister() {
      document.getElementById('regName').value = '';
      document.getElementById('regPhone').value = '';
      document.getElementById('regPassword').value = '';
      document.getElementById('registerMessage').textContent = '';
      document.getElementById('registerMessage').className = 'message';
      document.getElementById('registerModal').classList.add('show');
    }

    function hideModals() {
      document.getElementById('loginModal').classList.remove('show');
      document.getElementById('registerModal').classList.remove('show');
    }

    async function register() {
      const username = document.getElementById('regName').value.trim();
      const phone = document.getElementById('regPhone').value.trim();
      const password = document.getElementById('regPassword').value.trim();

      if (!username || !phone || !password) {
        showMessage('registerMessage', '❌ All fields required', true);
        return;
      }

      try {
        const data = await apiFetch('/auth/register', {
          method: 'POST',
          body: { username, phone, password }
        });

        localStorage.setItem(TOKEN_KEY, data.token);
        currentUser = data.user;
        updateUI();
        hideModals();
        showMessage('registerMessage', '✅ Registration successful!', false);
      } catch (err) {
        showMessage('registerMessage', '❌ ' + err.message, true);
      }
    }

    async function login() {
      const phone = document.getElementById('loginPhone').value.trim();
      const password = document.getElementById('loginPassword').value.trim();

      if (!phone || !password) {
        showMessage('loginMessage', '❌ Phone and password required', true);
        return;
      }

      try {
        const data = await apiFetch('/auth/login', {
          method: 'POST',
          body: { phone, password }
        });

        localStorage.setItem(TOKEN_KEY, data.token);
        currentUser = data.user;
        updateUI();
        hideModals();
      } catch (err) {
        showMessage('loginMessage', '❌ ' + err.message, true);
      }
    }

    function logout() {
      localStorage.removeItem(TOKEN_KEY);
      currentUser = null;
      updateUI();
    }

    function showMessage(elementId, message, isError) {
      const el = document.getElementById(elementId);
      el.textContent = message;
      el.className = `message ${isError ? 'error' : 'success'}`;
    }

    // Check if user is already logged in
    (async () => {
      const token = localStorage.getItem(TOKEN_KEY);
      if (token) {
        try {
          currentUser = await apiFetch('/users/me');
          updateUI();
        } catch (err) {
          localStorage.removeItem(TOKEN_KEY);
          currentUser = null;
          updateUI();
        }
      } else {
        updateUI();
      }
    })();

    // Close modals when clicking outside
    ['loginModal', 'registerModal'].forEach(id => {
      document.getElementById(id).addEventListener('click', (e) => {
        if (e.target.id === id) hideModals();
      });
    });
  </script>
</body>
</html>
